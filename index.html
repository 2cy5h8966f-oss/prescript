<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Prescripts">
<meta name="theme-color" content="#000000">

<link rel="apple-touch-icon" href="icon-180.png">
<title>Prescripts</title>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--ink:#d4e2ff;--dim:#6f82a8;--mark:#3a78ff;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pixelify Sans","Courier New",monospace;line-height:1.5}
main{max-width:520px;min-height:100%;margin:0 auto;padding:24px 18px;display:flex;flex-direction:column;justify-content:center;gap:18px}
.tabs{display:flex;gap:4px}
.tabs button{flex:1;width:auto;background:none;color:var(--dim);font-size:14px;min-height:40px;padding:6px;border-bottom:2px solid transparent}
.tabs button.on{color:var(--ink);border-bottom-color:var(--mark)}
.slip{padding:26px 22px;text-align:center}
.sigil{width:120px;height:auto;margin:0 auto 18px;display:block}
.text{font-size:22px;margin:0 0 18px;text-align:center;min-height:6.5em;white-space:pre-line}
.text.small{font-size:16px;text-align:left}
.due{font-size:14px;color:var(--dim);margin:0;text-align:center}
button{font:inherit;font-size:17px;color:var(--bg);background:var(--mark);border:0;padding:14px;min-height:52px;cursor:pointer;width:100%}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.sub{background:none;color:var(--dim);font-size:14px;min-height:36px;padding:6px;text-decoration:underline}
</style>
</head>
<body>
<main>
  <nav class="tabs" id="tabs">
    <button data-m="sea">SEA</button>
    <button data-m="prescripts" class="on">PRESCRIPTS</button>
    <button data-m="user">USER</button>
  </nav>

"look at the sky for thirty seconds, then write down what you saw",
"eat or drink something you have not had this week"];
const conds=["Do it exactly at the stated minute.","Stop if anyone speaks to you.","Do not check the time again.","Leave no trace.","Do it as if no one were watching.","Remember the order.","Wait one minute before you begin.","Do it twice.","Do not look back.","Do not explain why to anyone.","Use your left hand.",
"If anyone is nearby, wait until they leave.","Do not speak a word.",
"Do not rush.","Keep a serious face.","Make no sound while doing it.","Do not let anyone see you do it.","Repeat it once if you are interrupted.","Finish before the next hour begins.","Do not think about the reason.","","",""];
const sea=[
"The distant lights go out one by one,",
"The tide forgets the shore it left an hour ago.",
"A gull circles once, then follows no one.",
"Salt on the glass, and the horizon still unwritten.",
"Every wave arrives alone and leaves as the whole sea.",
"The harbor bell rings for ships that never learned its name.",
"Footprints in wet sand last exactly as long as the listening.",
"Beyond the last buoy, the water stops pretending to be shallow.",
"Night rises from the sea, not from the sky.",
"A lantern floats out, smaller each time you blink.",
"The shore keeps what the waves refuse.",
"Somewhere under the moon, a ship is still sailing home.",
"The foam writes a line and erases it before you can read.",
"Deep water is only quiet from above."];
const secret="— Dad, why do sea waves keep crying?\n— Because they’re sad that they’re knocking over the sand castles.\n— But why can’t they stop knocking them over?\n— The wind pulls the waves to build the castles, and the wind pulls them to break the castles too. So the waves have no reason to be sad.";
const $=id=>document.getElementById(id);
let tm,ac,mode="prescripts";
let st={r:0,c:0,s:0,sec:0};
try{Object.assign(st,JSON.parse(localStorage.getItem("prescripts-stats")||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem("prescripts-stats",JSON.stringify(st))}catch(e){}};
let lastP={text:"Press the button to receive a prescript.",open:false};
function tick(){
  try{
    ac=ac||new(window.AudioContext||window.webkitAudioContext)();
    if(ac.state==="suspended")ac.resume();
    const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;
    o.type="square";o.frequency.value=620;
    g.gain.setValueAtTime(.03,t);
    o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.03);
  }catch(e){}
}
function show(s,anim,due){
  clearTimeout(tm);
  const el=$("text");
  el.classList.toggle("small",s.length>120);
  $("due").textContent=due||"";
  if(!anim||matchMedia("(prefers-reduced-motion:reduce)").matches){el.textContent=s;return}
  const G="#£|}^%@$&*<>?/~=+";
  const n=s.length,at=[];
  for(let k=0;k<n;k++)at.push(k/n*22+Math.random()*10);
  let f=0;
  (function step(){
    let out="",done=true;
    for(let k=0;k<n;k++){
      if(s[k]===" "||s[k]==="\n"||f>=at[k])out+=s[k];
      else{out+=G[Math.floor(Math.random()*G.length)];done=false}
    }
    el.textContent=out;f++;
    if(!done){tick();tm=setTimeout(step,45)}
  })();
}
function statsText(){
  const p=st.r?Math.round(st.c/st.r*100):0;
  return "Prescripts received: "+st.r+"\nCompleted: "+st.c+" ("+p+"%)\nSea verses heard: "+st.s+"\nSecret: "+(st.sec?"found":"???");
}
function setMode(m){
  mode=m;
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.m===m));
  $("gen").hidden=m==="user";
  $("done").hidden=!(m==="prescripts"&&lastP.open);
  if(m==="prescripts"){$("gen").textContent="New prescript";show(lastP.text,false,"No reasons are given.")}
  else if(m==="sea"){$("gen").textContent="Listen to the sea";show("Press the button to hear the sea.",false,"")}
  else show(statsText(),true,"");
}
$("tabs").onclick=e=>{const b=e.target.closest("button");if(b)setMode(b.dataset.m)};
$("gen").onclick=()=>{
  if(mode==="sea"){
    st.s++;
    let s;
    if(Math.random()<1/9){s=secret;st.sec=1}else s=R(sea);
    save();show(s,true,"");
  }else if(mode==="prescripts"){
    const d=new Date(Date.now()+R([7,13,19,22,31,37,41,58,73,90])*60000),c=R(conds);
    const text="At "+pad(d.getHours())+":"+pad(d.getMinutes())+", "+R(acts)+"."+(c?" "+c:"");
    st.r++;save();
    lastP={text,open:true};
    $("done").hidden=false;
    show(text,true,"No reasons are given.");
  }
};
$("done").onclick=()=>{
  st.c++;save();
  lastP={text:"The prescript has been completed.",open:false};
  $("done").hidden=true;
  show(lastP.text,true,"The Index has received your report.");
};
setMode("prescripts");
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
